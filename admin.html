<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;900&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
    <title>A&A Cargo Express | Admin Portal</title>
    <style>
        body { font-family: 'Geist', sans-serif; }
      .font-mono { font-family: 'JetBrains Mono', monospace!important; }
      .glass-card {
            background: rgba(15, 23, 42, 0.75);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
        }
    </style>
</head>
<body class="bg-[#080c14] min-h-screen font-sans text-slate-200 flex items-center justify-center p-4">

    <div id="toast" class="fixed top-4 right-4 bg-emerald-600 text-white px-4 py-3 rounded-xl shadow-2xl font-black text-xs uppercase tracking-widest hidden z-50">
        <i class="fas fa-check-circle mr-2"></i><span id="toastMsg"></span>
    </div>

    <!-- LOGIN SCREEN -->
    <div id="loginScreen" class="w-full max-w-sm glass-card border border-slate-800/60 rounded-2xl p-6 shadow-2xl">
        <div class="text-center mb-6">
            <div class="w-12 h-12 rounded-xl bg-gradient-to-tr from-blue-600 to-emerald-500 flex items-center justify-center text-white text-xl mx-auto mb-3">
                <i class="fas fa-lock"></i>
            </div>
            <h1 class="text-xl font-black text-white uppercase tracking-wider">Admin Access</h1>
            <p class="text-slate-400 text-xs mt-1">A&A Cargo Express Control Panel</p>
        </div>
        <div class="space-y-3">
            <div>
                <label class="text- uppercase font-black text-slate-400 tracking-widest block mb-1">Password</label>
                <input type="password" id="adminPass" class="w-full bg-[#0d1324] text-white px-3 py-3 rounded-xl border border-slate-700/60 focus:outline-none focus:border-blue-500 text-xs" placeholder="Enter admin password">
            </div>
            <button onclick="checkPassword()" id="loginBtn" class="w-full bg-gradient-to-r from-blue-600 to-cyan-600 hover:from-blue-500 hover:to-cyan-500 text-white font-black py-3 rounded-xl transition duration-200 text-xs tracking-widest uppercase">
                Login
            </button>
            <p id="loginError" class="text-rose-400 text- text-center hidden">Invalid password</p>
        </div>
    </div>

    <!-- ADMIN DASHBOARD -->
    <div id="adminDashboard" class="hidden w-full max-w-6xl">
        <div class="glass-card border border-slate-800/60 rounded-2xl p-4 sm:p-6 shadow-2xl">
            <div class="flex justify-between items-center mb-6 pb-4 border-b border-slate-800/40">
                <div>
                    <h1 class="text-lg font-black text-white uppercase tracking-wider">Package Management</h1>
                    <p class="text-slate-400 text-">Add, update, or delete cargo manifests</p>
                </div>
                <button onclick="logout()" class="text-slate-400 hover:text-rose-400 text-xs flex items-center gap-1.5">
                    <i class="fas fa-sign-out-alt"></i> Logout
                </button>
            </div>

            <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
                <!-- ADD/EDIT FORM -->
                <div class="bg-[#060a12] p-4 rounded-xl border border-slate-800/50">
                    <h2 class="text-xs font-black text-blue-400 uppercase tracking-widest mb-3" id="formTitle">Add New Package</h2>
                    <form id="packageForm" class="space-y-3">
                        <input type="hidden" id="editId">
                        <div class="grid grid-cols-2 gap-3">
                            <div>
                                <label class="text- uppercase font-black text-slate-400 tracking-widest block mb-1">Tracking ID*</label>
                                <input type="text" id="trackingId" required class="w-full bg-[#0d1324] text-white px-3 py-2 rounded-lg border border-slate-700/60 focus:outline-none focus:border-blue-500 text-xs font-mono">
                            </div>
                            <div>
                                <label class="text- uppercase font-black text-slate-400 tracking-widest block mb-1">Status*</label>
                                <select id="status" required class="w-full bg-[#0d1324] text-white px-3 py-2 rounded-lg border border-slate-700/60 focus:outline-none focus:border-blue-500 text-xs">
                                    <option>IN TRANSIT</option>
                                    <option>ARRIVED AT HUB</option>
                                    <option>OUT FOR DELIVERY</option>
                                    <option>DELIVERED</option>
                                    <option>ON HOLD</option>
                                    <option>CUSTOMS DELAY</option>
                                </select>
                            </div>
                        </div>

                        <div class="grid grid-cols-2 gap-3">
                            <div>
                                <label class="text- uppercase font-black text-slate-400 tracking-widest block mb-1">Sender Name</label>
                                <input type="text" id="senderName" class="w-full bg-[#0d1324] text-white px-3 py-2 rounded-lg border border-slate-700/60 focus:outline-none focus:border-blue-500 text-xs">
                            </div>
                            <div>
                                <label class="text- uppercase font-black text-slate-400 tracking-widest block mb-1">Weight</label>
                                <input type="text" id="weight" placeholder="5.2 KG" class="w-full bg-[#0d1324] text-white px-3 py-2 rounded-lg border border-slate-700/60 focus:outline-none focus:border-blue-500 text-xs">
                            </div>
                        </div>

                        <div class="grid grid-cols-2 gap-3">
                            <div>
                                <label class="text- uppercase font-black text-slate-400 tracking-widest block mb-1">Origin</label>
                                <input type="text" id="origin" class="w-full bg-[#0d1324] text-white px-3 py-2 rounded-lg border border-slate-700/60 focus:outline-none focus:border-blue-500 text-xs">
                            </div>
                            <div>
                                <label class="text- uppercase font-black text-slate-400 tracking-widest block mb-1">Destination</label>
                                <input type="text" id="destination" class="w-full bg-[#0d1324] text-white px-3 py-2 rounded-lg border border-slate-700/60 focus:outline-none focus:border-blue-500 text-xs">
                            </div>
                        </div>

                        <div class="grid grid-cols-2 gap-3">
                            <div>
                                <label class="text- uppercase font-black text-slate-400 tracking-widest block mb-1">Current Location</label>
                                <input type="text" id="currentLocation" class="w-full bg-[#0d1324] text-white px-3 py-2 rounded-lg border border-slate-700/60 focus:outline-none focus:border-blue-500 text-xs">
                            </div>
                            <div>
                                <label class="text- uppercase font-black text-slate-400 tracking-widest block mb-1">ETA Date</label>
                                <input type="date" id="deliveryDate" class="w-full bg-[#0d1324] text-white px-3 py-2 rounded-lg border border-slate-700/60 focus:outline-none focus:border-blue-500 text-xs">
                            </div>
                        </div>

                        <div class="border-t border-slate-800/30 pt-3 mt-3">
                            <p class="text- uppercase font-black text-emerald-400 tracking-widest mb-2">Recipient Info</p>
                            <div class="grid grid-cols-1 gap-3">
                                <input type="text" id="recipientName" placeholder="Recipient Name" class="w-full bg-[#0d1324] text-white px-3 py-2 rounded-lg border border-slate-700/60 focus:outline-none focus:border-blue-500 text-xs">
                                <input type="text" id="recipientPhone" placeholder="Recipient Phone" class="w-full bg-[#0d1324] text-white px-3 py-2 rounded-lg border border-slate-700/60 focus:outline-none focus:border-blue-500 text-xs">
                                <input type="email" id="recipientEmail" placeholder="Recipient Email" class="w-full bg-[#0d1324] text-white px-3 py-2 rounded-lg border border-slate-700/60 focus:outline-none focus:border-blue-500 text-xs">
                            </div>
                        </div>

                        <div class="border-t border-slate-800/30 pt-3 mt-3">
                            <p class="text- uppercase font-black text-yellow-400 tracking-widest mb-2">Push Location Update</p>
                            <div class="flex gap-2 mb-2">
                                <input type="text" id="newLocationInput" placeholder="e.g. Arrived at Lagos Hub" class="flex-1 bg-[#0d1324] text-white px-3 py-2 rounded-lg border border-slate-700/60 focus:outline-none focus:border-yellow-500 text-xs">
                                <button type="button" onclick="addLocationToChain()" class="bg-yellow-600 hover:bg-yellow-500 text-white font-black px-4 rounded-lg text- uppercase">
                                    Push Chain
                                </button>
                            </div>
                            <div class="bg-[#0d1324] p-2 rounded-lg border border-slate-800/40 max-h-24 overflow-y-auto">
                                <p class="text- text-slate-500 mb-1">History Chain: <span id="chainCount" class="text-blue-400 font-bold">0</span> checkpoints</p>
                                <div id="historyChainPreview" class="space-y-1 text- font-mono"></div>
                            </div>
                        </div>

                        <div>
                            <label class="text- uppercase font-black text-slate-400 tracking-widest block mb-1">Description</label>
                            <input type="text" id="description" placeholder="Package contents" class="w-full bg-[#0d1324] text-white px-3 py-2 rounded-lg border border-slate-700/60 focus:outline-none focus:border-blue-500 text-xs">
                        </div>

                       <div>
    <label class="text- uppercase font-black text-slate-400 tracking-widest block mb-1">Package Image</label>
    <div class="flex gap-2 items-start">
        <button type="button" id="upload_widget_btn" class="bg-blue-600 hover:bg-blue-500 text-white font-black px-4 py-2 rounded-lg text-xs uppercase tracking-widest whitespace-nowrap">
            <i class="fas fa-cloud-upload-alt mr-1"></i> Upload
        </button>
        <div class="flex-1">
            <input type="hidden" id="image" name="image"> <!-- Keeps same id so your savePackage() works -->
            <div id="image_preview" class="bg-[#0d1324] border border-slate-700/60 rounded-lg p-2 min-h- flex items-center">
                <span class="text-slate-500 text-xs">No image uploaded</span>
            </div>
        </div>
    </div>
</div>

                        <div class="flex gap-2 pt-2">
                            <button type="button" onclick="savePackage()" id="saveBtn" class="flex-1 bg-gradient-to-r from-emerald-600 to-green-600 hover:from-emerald-500 hover:to-green-500 text-white font-black py-2.5 rounded-xl transition duration-200 text- tracking-widest uppercase">
                                Save and Commit Package Changes
                            </button>
                            <button type="button" onclick="resetForm()" class="bg-slate-700 hover:bg-slate-600 text-slate-300 font-black py-2.5 px-4 rounded-xl transition duration-200 text-">
                                Clear
                            </button>
                        </div>
                    </form>
                </div>

                <!-- PACKAGE LIST -->
                <div class="bg-[#060a12] p-4 rounded-xl border border-slate-800/50">
                    <div class="flex justify-between items-center mb-3">
                        <h2 class="text-xs font-black text-amber-400 uppercase tracking-widest">Existing Packages</h2>
                        <button onclick="loadPackages()" class="text-slate-400 hover:text-blue-400 text-">
                            <i class="fas fa-sync-alt"></i> Refresh
                        </button>
                    </div>
                    <div id="packageList" class="space-y-2 max-h- overflow-y-auto pr-1">
                        <p class="text-slate-500 text- text-center py-8">Loading packages...</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let allPackages = [];
        let currentHistoryChain = [];

        function getAuthHeaders() {
            return {
                'Content-Type': 'application/json',
                'Authorization': `Bearer ${sessionStorage.getItem('admin_token')}`
            };
        }

        function showToast(msg, type = 'success') {
            const toast = document.getElementById('toast');
            const color = type === 'error'? 'bg-rose-600' : 'bg-emerald-600';
            toast.className = `fixed top-4 right-4 ${color} text-white px-4 py-3 rounded-xl shadow-2xl font-black text-xs uppercase tracking-widest z-50`;
            document.getElementById('toastMsg').innerText = msg;
            toast.classList.remove('hidden');
            setTimeout(() => toast.classList.add('hidden'), 3000);
        }

        async function checkPassword() {
            const pass = document.getElementById('adminPass').value;
            const btn = document.getElementById('loginBtn');
            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-circle-notch animate-spin"></i> Verifying...';

            try {
                const res = await fetch('/api/admin-auth', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ password: pass })
                });

                if (!res.ok) throw new Error('Invalid password');

                const { token } = await res.json();
                sessionStorage.setItem('admin_token', token);

                document.getElementById('loginScreen').classList.add('hidden');
                document.getElementById('adminDashboard').classList.remove('hidden');
                loadPackages();
            } catch (e) {
                document.getElementById('loginError').classList.remove('hidden');
            } finally {
                btn.disabled = false;
                btn.innerText = 'Login';
            }
        }

        function logout() {
            sessionStorage.removeItem('admin_token');
            document.getElementById('loginScreen').classList.remove('hidden');
            document.getElementById('adminDashboard').classList.add('hidden');
            document.getElementById('adminPass').value = '';
        }

        function generateTrackingId() {
            const prefix = 'AAC';
            const num = Math.floor(10000 + Math.random() * 90000);
            const suffix = ['NX', 'XL', 'QR', 'YT', 'ZW'][Math.floor(Math.random() * 5)];
            return `${prefix}-${num}-${suffix}`;
        }

        function resetForm() {
            document.getElementById('packageForm').reset();
            document.getElementById('editId').value = '';
            document.getElementById('trackingId').value = generateTrackingId();
            document.getElementById('formTitle').innerText = 'Add New Package';
            currentHistoryChain = [];
            updateHistoryPreview();
        }

        async function loadPackages() {
            try {
                const res = await fetch('/api/list', { headers: getAuthHeaders() });
                if (res.status === 401) return logout();

                const data = await res.json();
                if (!res.ok) throw new Error(data.error);

                allPackages = data.packages || [];

                if (allPackages.length === 0) {
                    document.getElementById('packageList').innerHTML = '<p class="text-slate-500 text- text-center py-8">No packages found</p>';
                    return;
                }

                const html = allPackages.map(pkg => `
                    <div class="bg-[#0d1324] p-3 rounded-lg border border-slate-800/40 flex flex-col sm:flex-row sm:justify-between sm:items-center gap-2">
                        <div class="flex-1">
                            <div class="flex items-center gap-2 mb-1">
                                <span class="text-blue-400 font-mono text- font-bold">${pkg.trackingId}</span>
                                <span class="text- px-2 py-0.5 rounded ${getStatusColor(pkg.status)}">${pkg.status}</span>
                            </div>
                            <p class="text-slate-300 text-">${pkg.recipientName || 'No recipient'} → ${pkg.destination || 'No destination'}</p>
                        </div>
                        <div class="flex gap-2">
                            <button onclick="editPackage(${pkg.id})" class="bg-blue-600 hover:bg-blue-500 text-white px-3 py-1.5 rounded text- font-bold">
                                <i class="fas fa-edit"></i>
                            </button>
                            <button onclick="deletePackage(${pkg.id}, '${pkg.trackingId}')" class="bg-rose-600 hover:bg-rose-500 text-white px-3 py-1.5 rounded text- font-bold">
                                <i class="fas fa-trash"></i>
                            </button>
                        </div>
                    </div>
                `).join('');

                document.getElementById('packageList').innerHTML = html;
            } catch (error) {
                console.error('Fetch error:', error);
                showToast('Error loading packages', 'error');
            }
        }

        function getStatusColor(status) {
            if (status === 'DELIVERED') return 'bg-emerald-500/10 text-emerald-400';
            if (status === 'ON HOLD' || status === 'CUSTOMS DELAY') return 'bg-rose-500/10 text-rose-400';
            return 'bg-blue-500/10 text-blue-400';
        }

        async function savePackage() {
            const btn = document.getElementById('saveBtn');
            const editId = document.getElementById('editId').value;
            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-circle-notch animate-spin"></i> Saving...';

            const packageData = {
                trackingId: document.getElementById('trackingId').value.trim(),
                senderName: document.getElementById('senderName').value.trim(),
                recipientName: document.getElementById('recipientName').value.trim(),
                recipientPhone: document.getElementById('recipientPhone').value.trim(),
                recipientEmail: document.getElementById('recipientEmail').value.trim(),
                status: document.getElementById('status').value,
                origin: document.getElementById('origin').value.trim(),
                destination: document.getElementById('destination').value.trim(),
                weight: document.getElementById('weight').value.trim(),
                deliveryDate: document.getElementById('deliveryDate').value,
                currentLocation: document.getElementById('currentLocation').value.trim(),
                description: document.getElementById('description').value.trim(),
                image: document.getElementById('image').value.trim(),
                historyChain: currentHistoryChain
            };

            if (!packageData.trackingId) {
                showToast('Tracking ID is required', 'error');
                btn.disabled = false;
                btn.innerText = 'Save and Commit Package Changes';
                return;
            }

            try {
                const url = editId? `/api/update?id=${editId}` : '/api/create';
                const method = editId? 'PUT' : 'POST';

                const res = await fetch(url, {
                    method: method,
                    headers: getAuthHeaders(),
                    body: JSON.stringify(packageData)
                });

                if (res.status === 401) return logout();
                const data = await res.json();
                if (!res.ok) throw new Error(data.error || data.details || 'Failed to save');

                showToast(editId? 'Package updated!' : 'Package created!');
                resetForm();
                loadPackages();
            } catch (e) {
                showToast('Error: ' + e.message, 'error');
                console.error(e);
            } finally {
                btn.disabled = false;
                btn.innerText = 'Save and Commit Package Changes';
            }
        }

        function editPackage(id) {
            const pkg = allPackages.find(p => p.id === id);
            if (!pkg) return showToast('Package not found', 'error');

            document.getElementById('editId').value = pkg.id;
            document.getElementById('trackingId').value = pkg.trackingId || '';
            document.getElementById('senderName').value = pkg.senderName || '';
            document.getElementById('recipientName').value = pkg.recipientName || '';
            document.getElementById('recipientPhone').value = pkg.recipientPhone || '';
            document.getElementById('recipientEmail').value = pkg.recipientEmail || '';
            document.getElementById('status').value = pkg.status || 'IN TRANSIT';
            document.getElementById('origin').value = pkg.origin || '';
            document.getElementById('destination').value = pkg.destination || '';
            document.getElementById('weight').value = pkg.weight || '';
            document.getElementById('deliveryDate').value = pkg.deliveryDate || '';
            document.getElementById('currentLocation').value = pkg.currentLocation || '';
            document.getElementById('description').value = pkg.description || '';
            document.getElementById('image').value = pkg.image || '';

            currentHistoryChain = Array.isArray(pkg.historyChain)? pkg.historyChain : [];

            updateHistoryPreview();
            document.getElementById('formTitle').innerText = 'Edit Package';
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        async function deletePackage(id, trackingId) {
            if (!confirm(`Delete package ${trackingId}?`)) return;

            try {
                const res = await fetch(`/api/delete?id=${id}`, {
                    method: 'DELETE',
                    headers: getAuthHeaders()
                });

                if (res.status === 401) return logout();
                const data = await res.json();
                if (!res.ok) throw new Error(data.error || data.details);

                showToast('Package deleted');
                loadPackages();
            } catch (e) {
                showToast('Error: ' + e.message, 'error');
            }
        }

        function addLocationToChain() {
            const locInput = document.getElementById('newLocationInput');
            const loc = locInput.value.trim();
            if (!loc) {
                showToast('Enter a location', 'error');
                return;
            }

            currentHistoryChain.unshift({
                location: loc,
                time: new Date().toLocaleString('en-US', {
                    month: 'short',
                    day: 'numeric',
                    hour: '2-digit',
                    minute: '2-digit'
                })
            });

            locInput.value = '';
            updateHistoryPreview();
        }

       function updateHistoryPreview() {
    document.getElementById('chainCount').innerText = currentHistoryChain.length;
    const preview = document.getElementById('historyChainPreview');

    if (currentHistoryChain.length === 0) {
        preview.innerHTML = '<p class="text-slate-600">No checkpoints yet</p>';
        return;
    }

    preview.innerHTML = currentHistoryChain.map((item, idx) => {
        const isLatest = idx === 0; // Since you unshift, 0 is the latest
        const isLast = idx === currentHistoryChain.length - 1;
        
        return `
            <div class="relative flex gap-3 pb-4 ${isLast ? 'pb-0' : ''}">
                <!-- Vertical line connecting dots -->
                ${!isLast ? '<div class="absolute left- top- w-0.5 h-full bg-slate-700"></div>' : ''}
                
                <!-- Dot indicator -->
                <div class="relative z-10 mt-1">
                    <div class="w- h- rounded-full ${isLatest ? 'bg-yellow-400 ring-4 ring-yellow-400/20 animate-pulse' : 'bg-blue-500'}"></div>
                </div>
                
                <!-- Location + Time -->
                <div class="flex-1">
                    <div class="flex justify-between items-start">
                        <span class="${isLatest ? 'text-yellow-400 font-bold' : 'text-slate-300'} text-xs">${item.location}</span>
                        <span class="text-slate-500 text- ml-2 whitespace-nowrap">${item.time}</span>
                    </div>
                </div>
            </div>
        `;
    }).join('');
}
        document.getElementById('adminPass').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') checkPassword();
        });

        window.onload = () => {
            resetForm();
            // Auto-logout if token exists but expired
            if (sessionStorage.getItem('admin_token')) {
                document.getElementById('loginScreen').classList.add('hidden');
                document.getElementById('adminDashboard').classList.remove('hidden');
                loadPackages();
            }
        };
    </script>
    <!-- Cloudinary Upload Widget -->
<script src="https://upload-widget.cloudinary.com/global/all.js" type="text/javascript"></script>
<script type="text/javascript">
const cloudName = "bvsldzzs"; // <-- LINE 1: Put your Cloudinary cloud name here
const uploadPreset = "waybill_app_preset"; // <-- LINE 2: Put your unsigned preset here

const uploadWidget = cloudinary.createUploadWidget({
    cloudName: cloudName,
    uploadPreset: uploadPreset,
    sources: ["local", "camera", "url"],
    multiple: false,
    cropping: true,
    folder: "aa_cargo_packages",
    clientAllowedFormats: ["jpg", "png", "jpeg", "webp"],
    maxFileSize: 5000000 // 5MB limit
  },
  (error, result) => {
    if (!error && result && result.event === "success") {
      const url = result.info.secure_url;
      document.getElementById("image").value = url;
      document.getElementById("image_preview").innerHTML = `
        <img src="${url}" class="h-10 w-10 object-cover rounded mr-2" />
        <span class="text-emerald-400 text-xs"><i class="fas fa-check"></i> Uploaded</span>
      `;
      showToast('Image uploaded successfully');
    }
    if (error) {
      showToast('Upload failed: ' + error.message, 'error');
    }
  }
);

document.getElementById("upload_widget_btn").addEventListener("click", function() {
    uploadWidget.open();
  }, false);

// Helper to show existing image when editing
function showExistingImage(url) {
    if (url) {
        document.getElementById("image_preview").innerHTML = `
          <img src="${url}" class="h-10 w-10 object-cover rounded mr-2" />
          <span class="text-slate-300 text-xs">Current image</span>
        `;
    } else {
        document.getElementById("image_preview").innerHTML = `<span class="text-slate-500 text-xs">No image uploaded</span>`;
    }
}
</script>
</body>
</body>
</html>
